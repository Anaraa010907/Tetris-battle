name: Build release AAB for Google Play

# Signed Android App Bundle (.aab) for Google Play. Run it by hand: Actions -> Build release AAB for
# Google Play -> Run workflow. Needs four repository secrets with the upload key (docs/LAUNCH.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional: SUPABASE_URL and SUPABASE_ANON_KEY make it the online version (docs/SUPABASE.md).

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (leave empty: run number + 100). Must be higher than every earlier upload.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android Gradle Plugin 8.13 needs Gradle 8.13+ and JDK 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # compileSdk/targetSdk 36; build-tools 35.0.0 is AGP 8.13's default
      - name: Install Android platform and build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Copy game into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      # Optional: with the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets the bundle is built online;
      # without them it is the offline version. The Data safety answers differ (docs/LAUNCH.md).
      - name: Add Supabase settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os
          url, key = os.environ.get('SUPABASE_URL', '').strip(), os.environ.get('SUPABASE_ANON_KEY', '').strip()
          path = 'android/app/src/main/assets/index.html'
          html = open(path, encoding='utf-8').read()
          empty = '{"supabaseUrl":"","supabaseAnonKey":""}'
          if not (url and key):
              note = 'No Supabase secrets: OFFLINE version'
          elif empty not in html:
              note = 'index.html already has Supabase settings: kept them (ONLINE version)'
          else:
              html = html.replace(empty, json.dumps({'supabaseUrl': url, 'supabaseAnonKey': key}))
              open(path, 'w', encoding='utf-8').write(html)
              note = 'Supabase settings added: ONLINE version'
          print(note)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as s:
              s.write('- ' + note + '\n')
          EOF

      - name: Check signing secrets and the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/LAUNCH.md (upload key)."
            exit 1
          fi
          # line breaks or spaces copied along with the base64 text are ignored
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null \
             || [ ! -s "$RUNNER_TEMP/upload.jks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 of the .jks file. See docs/LAUNCH.md."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
               -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore does not open with ANDROID_KEYSTORE_PASSWORD, or has no key named ANDROID_KEY_ALIAS."
            exit 1
          fi
          # Not secret: compare with Play Console -> Play app signing page -> "Upload key certificate"
          echo "Upload key certificate fingerprints:"
          keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -E 'SHA1:|SHA256:' || true

      - name: Choose the version code
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          # every upload to Google Play needs a higher version code
          vc="$(printf '%s' "$INPUT_VERSION_CODE" | tr -d ' ')"
          if [ -z "$vc" ]; then
            vc=$((GITHUB_RUN_NUMBER + 100))
          elif ! [[ "$vc" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::version_code must be a whole number (1 to 999999999)."
            exit 1
          fi
          echo "NEON_VERSION_CODE=$vc" >> "$GITHUB_ENV"
          echo "versionCode $vc"
          echo "- versionCode: $vc" >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v6
        with:
          name: khan-blocks-release-aab-${{ env.NEON_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
