name: Build release AAB for Google Play

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android platform and build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Copy game into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      # Optional: with the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets the APK is built online;
      # without them it is the offline version. See docs/SUPABASE.md.
      - name: Add Supabase settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os
          url, key = os.environ.get('SUPABASE_URL', '').strip(), os.environ.get('SUPABASE_ANON_KEY', '').strip()
          path = 'android/app/src/main/assets/index.html'
          html = open(path, encoding='utf-8').read()
          empty = '{"supabaseUrl":"","supabaseAnonKey":""}'
          if not (url and key):
              print('No Supabase secrets: building the offline version')
          elif empty not in html:
              print('index.html already has Supabase settings: keeping them')
          else:
              html = html.replace(empty, json.dumps({'supabaseUrl': url, 'supabaseAnonKey': key}))
              open(path, 'w', encoding='utf-8').write(html)
              print('Supabase settings added for', url)
          EOF

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/LAUNCH.md (upload key)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # every upload to Google Play needs a higher version code
          export NEON_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          echo "versionCode $NEON_VERSION_CODE"
          gradle bundleRelease --no-daemon

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: neon-duel-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
