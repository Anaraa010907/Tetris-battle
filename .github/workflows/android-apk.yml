name: Build Android APK

# Debug APK for testing on your own phone. Run it by hand: Actions -> Build Android APK -> Run workflow.
# For Google Play use "Build release AAB for Google Play" instead (docs/LAUNCH.md).
# A debug build always shows Google's test ads. Purchases work for license testers (docs/MONETIZATION.md).

on:
  workflow_dispatch:
    inputs:
      consent_test:
        description: 'Consent test: show the EEA privacy (UMP) form on every start (emulator, or the ADS_TEST_DEVICE variable)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android Gradle Plugin 8.13 needs Gradle 8.13+ and JDK 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # compileSdk/targetSdk 36; build-tools 35.0.0 is AGP 8.13's default
      - name: Install Android platform and build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Copy game into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      # Optional: with the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets the APK is built online;
      # without them it is the offline version. See docs/SUPABASE.md.
      - name: Add Supabase settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os
          url, key = os.environ.get('SUPABASE_URL', '').strip(), os.environ.get('SUPABASE_ANON_KEY', '').strip()
          path = 'android/app/src/main/assets/index.html'
          html = open(path, encoding='utf-8').read()
          empty = '{"supabaseUrl":"","supabaseAnonKey":""}'
          if not (url and key):
              print('No Supabase secrets: building the offline version')
          elif empty not in html:
              print('index.html already has Supabase settings: keeping them')
          else:
              html = html.replace(empty, json.dumps({'supabaseUrl': url, 'supabaseAnonKey': key}))
              open(path, 'w', encoding='utf-8').write(html)
              print('Supabase settings added for', url)
          EOF

      - name: Build debug APK
        working-directory: android
        env:
          UMP_DEBUG_EEA: ${{ inputs.consent_test && 'true' || 'false' }}
          ADS_TEST_DEVICE: ${{ vars.ADS_TEST_DEVICE }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v6
        with:
          name: khan-blocks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
