name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform and build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Copy game into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      # Optional: with the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets the APK is built online;
      # without them it is the offline version. See docs/SUPABASE.md.
      - name: Add Supabase settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os
          url, key = os.environ.get('SUPABASE_URL', '').strip(), os.environ.get('SUPABASE_ANON_KEY', '').strip()
          path = 'android/app/src/main/assets/index.html'
          html = open(path, encoding='utf-8').read()
          empty = '{"supabaseUrl":"","supabaseAnonKey":""}'
          if not (url and key):
              print('No Supabase secrets: building the offline version')
          elif empty not in html:
              print('index.html already has Supabase settings: keeping them')
          else:
              html = html.replace(empty, json.dumps({'supabaseUrl': url, 'supabaseAnonKey': key}))
              open(path, 'w', encoding='utf-8').write(html)
              print('Supabase settings added for', url)
          EOF

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: neon-duel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
