// script before the game script and call adoptHostGeometry() once).
//
// Every client draws one menu capsule (author avatar + exit) in the top-right
// corner, just under the status bar; the top-left corner belongs to the game.
// The constants below are the contract the upload check enforces (rules H1-H4):
// nothing readable or tappable inside MENU_BOX, nothing above SAFE_TOP or
// outside the EDGE_GUARD columns, no taps below SAFE_BOTTOM. They mirror
// layout.css :root and game-tools/src/review_contract.rs (HOST_*); change all
// three together.
//
// Like TikTok / WeChat mini games, the top bar sits on the capsule's centre
// line when the host reports the real capsule: it may then rise above
// SAFE_TOP, but its top stays at or below capsule.top - 4 (the checks allow
// exactly that for items left of the menu box). The second row starts 8 px
// under the capsule and the bar; while it is still beside the menu box
// (above y 168) it stops at x 372. Nothing ever enters MENU_BOX.
//
// Sources, in order:
//   1. window.mable.getMenuButtonBoundingClientRect(): synchronous, canvas
//      logical px { left, top, right, bottom, width, height }, injected by the
//      host before the game script runs. A rect taller than a capsule (the
//      host's MENU_BOX fallback) means "no real capsule".
//   2. `mable:host-geometry` message: the rect with role "menu" is the
//      capsule. Older hosts send no "menu"; their buttons on the right half
//      (back / more / app) only nudge the bar inside y 98..160, and the left
//      half and edge-guard / browser-* bands are ignored.
//   3. Neither: MENU_BOX, top bar y 98..150, second row from y 168.

var MABLE_HOST = {
  canvas: { width: 504, height: 1092 },
  menuBox: { x: 380, y: 0, width: 124, height: 160 },
  safeTop: 98,
  safeBottom: 970,
  edgeGuard: 22,
  topBarH: 52,
  rowGap: 8,
  // Sound toggle (games with audio): this size, at the bar's left end, centred
  // on it; the bar's other items start soundGap after it.
  soundSize: 44,
  soundGap: 12,
  // The bar's top may sit this far above the capsule's top, no further.
  capsuleSlack: 4,
  // Anything taller is a reserved box, not a capsule (32pt is ~45 px at most).
  capsuleMaxH: 64,
};

function hostFinite(value) {
  return typeof value === 'number' && Number.isFinite(value);
}

// A clamped { left, top, right, bottom, width, height } or null.
function hostRect(left, top, right, bottom) {
  var W = MABLE_HOST.canvas.width, H = MABLE_HOST.canvas.height;
  if (![left, top, right, bottom].every(hostFinite)) return null;
  var clamp = function (v, hi) { return Math.min(hi, Math.max(0, v)); };
  var l = clamp(left, W), t = clamp(top, H), r = clamp(right, W), b = clamp(bottom, H);
  if (!(r > l) || !(b > t)) return null;
  return { left: l, top: t, right: r, bottom: b, width: r - l, height: b - t };
}

// A real capsule: on the right half, near the top, capsule-sized.
function hostCapsule(rect) {
  var W = MABLE_HOST.canvas.width, H = MABLE_HOST.canvas.height;
  if (!rect || rect.height > MABLE_HOST.capsuleMaxH || rect.left + rect.width / 2 < W / 2 || rect.top > H / 4) return null;
  rect.menu = true;
  return rect;
}

// The capsule from the synchronous host API, or null.
function readMenuButton() {
  try {
    var api = window.mable && window.mable.getMenuButtonBoundingClientRect;
    var rect = typeof api === 'function' ? api.call(window.mable) : null;
    if (!rect) return null;
    var right = hostFinite(rect.right) ? rect.right : rect.left + rect.width;
    var bottom = hostFinite(rect.bottom) ? rect.bottom : rect.top + rect.height;
    return hostCapsule(hostRect(rect.left, rect.top, right, bottom));
  } catch (_error) {
    return null;
  }
}

// The capsule from a mable:host-geometry payload, or null. `menu` is true
// only for a role "menu" rect (a capsule host).
function readHostGeometry(payload) {
  if (!payload || !payload.canvas || !hostFinite(payload.canvas.width) || !hostFinite(payload.canvas.height)) return null;
  var rects = Array.isArray(payload.occlusionRects) ? payload.occlusionRects : [];
  var W = MABLE_HOST.canvas.width, H = MABLE_HOST.canvas.height;
  var capsule = null;
  for (var i = 0; i < rects.length; i++) {
    var r = rects[i];
    if (!r) continue;
    var role = String(r.role || '');
    if (role === 'edge-guard' || role.indexOf('browser-') === 0) continue;
    var box = hostRect(r.x, r.y, r.x + r.width, r.y + r.height);
    if (role === 'menu') {
      var menu = hostCapsule(box);
      if (menu) return menu;
      continue;
    }
    // Position decides, not the role name: a back button on the right is part
    // of the buttons there, and nothing on the left is.
    if (!box || box.left + box.width / 2 < W / 2 || box.top > H / 4 || box.width * box.height > W * H * 0.05) continue;
    capsule = capsule
      ? hostRect(Math.min(capsule.left, box.left), Math.min(capsule.top, box.top), Math.max(capsule.right, box.right), Math.max(capsule.bottom, box.bottom))
      : box;
  }
  return capsule;
}

// The top of the visible canvas from a mable:host-geometry payload (0 if none).
function readVisibleTop(payload) {
  var v = payload && payload.visibleRect;
  return v && hostFinite(v.y) ? Math.min(MABLE_HOST.safeTop, Math.max(0, v.y)) : 0;
}

// Layout numbers for a capsule rect (null: the MENU_BOX fallback).
function hostLayout(capsule, visibleTop) {
  var h = MABLE_HOST, m = h.menuBox, W = h.canvas.width;
  var menuBottom = m.y + m.height;
  var round = function (v) { return Math.round(v * 10) / 10; };
  var barH = h.topBarH, top, rowTop;
  if (capsule && capsule.menu) {
    // Centre on the capsule; shrink the bar rather than rise above capsule.top - 4.
    barH = Math.min(h.topBarH, capsule.height + 2 * h.capsuleSlack);
    top = Math.max(capsule.top + capsule.height / 2 - barH / 2, capsule.top - h.capsuleSlack, hostFinite(visibleTop) ? visibleTop : 0);
    top = Math.min(top, menuBottom - barH);
    rowTop = Math.max(capsule.bottom, top + barH) + h.rowGap;
  } else {
    // No capsule, or an older host's buttons: stay in y 98..160.
    var min = h.safeTop + h.topBarH / 2, max = menuBottom - h.topBarH / 2;
    var centre = capsule ? Math.min(max, Math.max(min, capsule.top + capsule.height / 2)) : min;
    top = centre - barH / 2;
    rowTop = menuBottom + h.rowGap;
  }
  top = round(top);
  rowTop = round(rowTop);
  var beside = rowTop < menuBottom + h.rowGap;
  return {
    menuBox: { left: m.x, top: m.y, right: m.x + m.width, bottom: menuBottom },
    capsule: capsule,
    rowCenter: round(top + barH / 2),
    topBar: { left: h.edgeGuard, right: m.x - h.rowGap, top: top, bottom: round(top + barH) },
    // Where a canvas-drawn sound toggle goes; other bar items from its right + soundGap.
    // Never above the bar's top (a short capsule makes the bar shorter than 44).
    soundButton: {
      left: h.edgeGuard,
      top: round(Math.max(top, top + barH / 2 - h.soundSize / 2)),
      right: h.edgeGuard + h.soundSize,
      bottom: round(Math.max(top, top + barH / 2 - h.soundSize / 2) + h.soundSize),
    },
    soundGap: h.soundGap,
    rowTop: rowTop,
    // Right edge of the second row: beside the menu box it stops at x 372.
    rowRight: beside ? m.x - h.rowGap : W - h.edgeGuard,
    safeTop: h.safeTop,
    safeBottom: h.safeBottom,
    edgeGuard: h.edgeGuard,
  };
}

function adoptHostGeometry(onChange) {
  var root = document.documentElement;
  var W = MABLE_HOST.canvas.width;
  var legacy = null, visibleTop = 0;
  var last = '';
  function apply() {
    var layout = hostLayout(readMenuButton() || legacy, visibleTop);
    var bar = layout.topBar;
    var key = [bar.top, bar.bottom, layout.rowTop, layout.rowRight].join();
    if (key === last) return layout;
    last = key;
    root.style.setProperty('--top-bar-top', bar.top + 'px');
    root.style.setProperty('--top-bar-h', Math.round((bar.bottom - bar.top) * 10) / 10 + 'px');
    root.style.setProperty('--host-row-center', layout.rowCenter + 'px');
    root.style.setProperty('--row-top', layout.rowTop + 'px');
    root.style.setProperty('--row-right', W - layout.rowRight + 'px');
    if (typeof onChange === 'function') onChange(layout);
    return layout;
  }
  function receive(event) {
    var payload = event && event.data;
    if (!payload || payload.type !== 'mable:host-geometry' || payload.version !== 1) return;
    legacy = readHostGeometry(payload);
    visibleTop = readVisibleTop(payload);
    apply();
  }
  window.addEventListener('message', receive);
  window.addEventListener('resize', apply);
  if (window.__mableHostGeometry) receive({ data: window.__mableHostGeometry });
  try {
    window.parent.postMessage({ type: 'mable:host-geometry-request', version: 1 }, '*');
  } catch (_error) {
    // No parent, or a parent that refuses the message. MENU_BOX stays in force.
  }
  apply();
  return function () {
    window.removeEventListener('message', receive);
    window.removeEventListener('resize', apply);
  };
}

  // game by scanning audio and video elements, and a detached element escapes

const $=id=>document.getElementById(id);const STRINGS=JSON.parse($('translations').textContent);let profile={name:'NOMAD',avatar:'✦',rank:1000,wins:0,losses:0,coins:0,streak:0,lastClaim:'',account:null,theme:0,owned:[0],lang:'mn',sound:true,vibration:true};try{const saved=JSON.parse(localStorage.getItem('neon-duel')||'{}');if(saved&&typeof saved==='object'){if(typeof saved.lastClaim==='string')profile.lastClaim=saved.lastClaim;if(saved.account&&typeof saved.account.user==='string'&&typeof saved.account.hash==='string')profile.account={user:saved.account.user,hash:saved.account.hash,in:!!saved.account.in};if(typeof saved.name==='string')profile.name=saved.name.trim().slice(0,16)||'NOMAD';if(['✦','◈','☾','⚡'].includes(saved.avatar))profile.avatar=saved.avatar;for(const k of ['rank','wins','losses','coins','streak'])if(Number.isFinite(saved[k]))profile[k]=Math.max(0,Math.floor(saved[k]));for(const k of ['sound','vibration'])if(typeof saved[k]==='boolean')profile[k]=saved[k];if(['mn','en'].includes(saved.lang))profile.lang=saved.lang;if(Array.isArray(saved.owned))profile.owned=[0,...new Set(saved.owned.filter(v=>v===1||v===2))];if(profile.owned.includes(saved.theme))profile.theme=saved.theme}}catch(e){}function save(){try{localStorage.setItem('neon-duel',JSON.stringify(profile))}catch(e){}}function t(k){return STRINGS[profile.lang]?.[k]||k}function translate(){document.documentElement.lang=profile.lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('language').textContent=profile.lang==='mn'?'EN':'МН';$('headStatus').textContent=t('offline');$('outcome').textContent=t('resultTitle');document.querySelectorAll('[data-action]').forEach(el=>{if(STRINGS[profile.lang][el.dataset.action])el.setAttribute('aria-label',t(el.dataset.action))});$('sound').setAttribute('aria-label',t('soundLabel'));profileView()}function dayKey(off){const d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}function canClaim(){return profile.lastClaim!==dayKey(0)}function nextStreak(){return profile.lastClaim===dayKey(-1)?(profile.streak||0)+1:1}function bonusFor(){return Math.min(7,nextStreak())*10}function claimDaily(){if(!canClaim())return 0;const bonus=bonusFor();profile.streak=nextStreak();profile.lastClaim=dayKey(0);profile.coins+=bonus;save();profileView();return bonus}const INP='width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #293c59;background:#070c1b;color:#eef5ff';function tierKey(r){return r>=1600?'tierDiamond':r>=1400?'tierPlatinum':r>=1250?'tierGold':r>=1100?'tierSilver':'tierBronze'}async function hashPw(u,p){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u.toLowerCase()+':'+p));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}function quick(){const OPP=['NOVA_7','Kairo','Mira','Taiga','Orbit','Zed'];const foe=OPP[Math.floor(Math.random()*OPP.length)];modal('<span class="eyebrow">'+t('quick')+'</span><h2 id="qTitle">'+t('searching')+'</h2><div class="title-art"><i></i><i></i><i></i></div><p class="muted">'+t('simNote')+'</p><button class="primary wide" id="qPlay" disabled>'+t('play')+'</button><button class="wide" id="qCancel">'+t('cancel')+'</button>');$('qCancel').onclick=closeModal;setTimeout(()=>{const q=$('qPlay');if(!q)return;$('qTitle').textContent=t('found')+': '+foe;q.disabled=false;q.onclick=()=>{closeModal();start()}},2200)}function stats(){const can=canClaim(),acc=profile.account,on=!!(acc&&acc.in);let h='<span class="eyebrow">'+t('profile')+'</span><h2>'+profile.avatar+' '+profile.name+'</h2><p>'+profile.wins+' '+t('wins')+' · '+profile.losses+' '+t('losses')+' · '+t(tierKey(profile.rank))+' '+profile.rank+'</p><div class="panel" style="margin:16px 0"><b>'+t('daily')+'</b><p class="muted">'+(profile.streak||0)+' '+t('streakDays')+'</p><button class="primary wide" id="claimDaily"'+(can?'':' disabled')+'>'+(can?t('claim')+' · +'+bonusFor()+' '+t('coins'):t('claimed'))+'</but function rotate(b){let p=b.piece;if(p.id===1)return;let m=p.m[0].map((_,i)=>p.m.map(r=>r[i]).reverse());for(let up=0;up<=Math.min(3,p.m[0].length-1);up++)for(let d of [0,-1,1,-2,2])if(!hit(b,m,p.x+d,p.y-up)){let grounded=hit(b,p.m,p.x,p.y+1);p.m=m;p.x+=d;p.y-=up;if(grounded)resetLanding(b);return}}function move(b,dx,dy){let p=b.piece;if(!hit(b,p.m,p.x+dx,p.y+dy)){if(dx&&hit(b,p.m,p.x,p.y+1))resetLanding(b);p.x+=dx;p.y+=dy;return true}return false}function hard(b){while(move(b,0,1))b.score+=2;lock(b)}function vibrate(){if(profile.vibration&&navigator.vibrate)try{navigator.vibrate(35)}catch(e){}}function sound(name){audio.play(name,{volume:.5})}function lock(b){let p=b.piece;for(let r=0;r<p.m.length;r++)for(let c=0;c<p.m[r].length;c++)if(p.m[r][c]&&p.y+r<0){b.dead=true;finish(b!==boards[0]);return}for(let r=0;r<p.m.length;r++)for(let c=0;c<p.m[r].length;c++)if(p.m[r][c]){if(p.y+r<0){b.dead=true;return}b.cells[p.y+r][p.x+c]=p.id+1}let n=0;for(let y=19;y>=0;y--){if(b.cells[y].every(v=>v)){b.cells.splice(y,1);b.cells.unshift(Array(10).fill(0));n++;y++}}b.lines+=n;b.score+=[0,100,300,500,800][n]*(1+Math.floor(b.lines/10));let other=boards[b===boards[0]?1:0];if(n>=2){let attack=[0,0,1,2,4][n];if(other.shield)other.shield=false;else other.incoming+=attack;log.push({tick,type:'garbage',to:b===boards[0]?1:0,rows:attack})}if(b===boards[0]){sound(n?'clear':'lock');if(n){vibrate();flashTime=.18;notice(n+' '+t('lines')+(n>=2?' • +'+[0,0,1,2,4][n]+' '+t('attack'):''));earned+=n;while(earned>=param('powerLines')){earned-=param('powerLines');if(powers.length<2)powers.push(Math.floor(rnd()*3))}}}if(b.incoming){if(b===boards[0]){vibrate();notice('+'+b.incoming+' '+t('incoming'));}for(let i=0;i<b.incoming;i++){if(b.cells[0].some(v=>v))b.dead=true;b.cells.shift();let row=Array(10).fill(8);row[Math.floor(rnd()*10)]=0;b.cells.push(row)}b.incoming=0}spawn(b);if(b.dead)finish(b!==boards[0])}function ai(){let b=boards[1],p=b.piece,best=1e9,target=null,m=p.m;for(let rot=0;rot<4;rot++){for(let function modal(html){$('modal').innerHTML=html;$('modal').hidden=false;$('title').inert=true;$('gameplay').inert=true}function closeModal(){$('modal').hidden=true;$('title').inert=false;$('gameplay').inert=false}function pause(){if(state!=='play')return;state='pause';heldAction='';audio.stopMusic();modal('<h2>'+t('paused')+'</h2><div class="stack"><button class="primary" id="resume">'+t('resume')+'</button><button id="quit">'+t('home')+'</button></div>');$('resume').onclick=()=>{closeModal();state='play';unlockAudio()};$('quit').onclick=()=>{state='title';screen('title');profileView()}}$('pause').onclick=pause;$('start').onclick=start;$('rematch').onclick=start;$('home').onclick=()=>{state='title';screen('title');profileView()};$('language').onclick=()=>{profile.lang=profile.lang==='mn'?'en':'mn';save();translate()};$('sound').onclick=()=>{profile.sound=!profile.sound;save();$('sound').textContent=profile.sound?'♫':'♪';unlockAudio()};$('tutorial').onclick=()=>tutorial(0);function tutorial(i){modal('<span class="eyebrow">'+(i+1)+' / 3</span><h2>'+t('t'+i)+'</h2><p>'+t('d'+i)+'</p><button class="primary wide" id="tNext">'+t(i===2?'done':'continue')+'</button>');$('tNext').onclick=()=>i===2?closeModal():tutorial(i+1)}function info(title,body){modal('<h2>'+t(title)+'</h2><p>'+t(body)+'</p><button class="wide" id="infoDone">'+t('done')+'</button>');$('infoDone').onclick=closeModal}
